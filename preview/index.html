主畫面，像 App 一樣使用<\/span>\n    <button id=\"installBtn\">安裝<\/button>\n  <\/div>\n\n  <a class=\"btn primary\" href=\"https://www.pet.gov.tw/Web/O201_Fido.aspx?s=999\" target=\"_blank\" rel=\"noopener\">\n    <span class=\"ico\" aria-hidden=\"true\">🔍<\/span>\n    <span class=\"tx\"><b>開始查詢<\/b><span>晶片查詢免登入<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <div class=\"section-label\">官方登入與會員操作<\/div>\n\n  <a class=\"btn\" href=\"https://www.pet.gov.tw/Web/O201_Fido.aspx?s=999\" target=\"_blank\" rel=\"noopener\">\n    <span class=\"ico\" aria-hidden=\"true\">🔑<\/span>\n    <span class=\"tx\"><b>登入官方系統<\/b><span>由你本人輸入驗證碼登入<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <a class=\"btn\" href=\"https://www.pet.gov.tw/Web/O201_Fido.aspx?s=999\" target=\"_blank\" rel=\"noopener\">\n    <span class=\"ico\" aria-hidden=\"true\">🔁<\/span>\n    <span class=\"tx\"><b>轉讓・過戶（轉入／轉出）<\/b><span>登入後於會員專區辦理<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <div class=\"loginnote\">\n    🔒 登入與驗證碼由<b>你本人在官網完成<\/b>，不繞驗證。登入狀態（Session）由<b>你的瀏覽器在本機保管<\/b>，\n    本 App 不會也無法讀取你的登入 Cookie（跨網域與 HttpOnly 限制）。在 Session 有效期間，\n    用同一個瀏覽器從本 App 開啟官方頁都是<b>已登入狀態<\/b>，查詢／轉讓免重複登入。\n  <\/div>\n\n  <div class=\"section-label\">我的常用晶片號碼<\/div>\n  <div class=\"fav\">\n    <div class=\"add\">\n      <input id=\"favChip\" inputmode=\"numeric\" placeholder=\"晶片號碼（可含連字號）\" aria-label=\"晶片號碼（可含連字號）\" />\n      <input id=\"favName\" maxlength=\"12\" placeholder=\"名稱（選填）\" aria-label=\"寵物名稱（選填）\" />\n      <button id=\"favAdd\" type=\"button\">＋ 加入<\/button>\n    <\/div>\n    <div class=\"search\" id=\"favSearchWrap\">\n      <span class=\"si\" aria-hidden=\"true\">🔍<\/span>\n      <input id=\"favSearch\" type=\"search\" placeholder=\"搜尋名稱或晶片號碼\" aria-label=\"搜尋已儲存的名稱或晶片號碼\" />\n      <button class=\"sx\" id=\"favSearchClear\" type=\"button\" aria-label=\"清除\">✕<\/button>\n    <\/div>\n    <ul id=\"favList\"><\/ul>\n    <p class=\"empty\" id=\"favEmpty\">尚未儲存任何晶片號碼。<br />號碼只會存在這支手機，不會上傳。<\/p>\n    <div class=\"tools\">\n      <button id=\"favExport\" type=\"button\">⬇ 匯出備份<\/button>\n      <label class=\"impbtn\">⬆ 匯入備份\n        <input id=\"favImport\" type=\"file\" accept=\"application/json,.json\" hidden />\n      <\/label>\n    <\/div>\n  <\/div>\n\n  <div class=\"section-label\">查詢方式<\/div>\n\n  <a class=\"btn\" href=\"https://www.pet.gov.tw/Web/O201_Fido.aspx?s=999\" target=\"_blank\" rel=\"noopener\">\n    <span class=\"ico\" aria-hidden=\"true\">🏷️<\/span>\n    <span class=\"tx\"><b>依晶片號碼查詢<\/b><span>輸入寵物晶片號碼<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <a class=\"btn\" href=\"https://www.pet.gov.tw/Web/O201_Fido.aspx?s=999\" target=\"_blank\" rel=\"noopener\">\n    <span class=\"ico\" aria-hidden=\"true\">👤<\/span>\n    <span class=\"tx\"><b>依飼主資料查詢<\/b><span>飼主生日 + 證號<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <a class=\"btn\" href=\"https://www.pet.gov.tw/\" target=\"_blank\" rel=\"noopener\">\n    <span class=\"ico\" aria-hidden=\"true\">🏠<\/span>\n    <span class=\"tx\"><b>寵物登記管理資訊網<\/b><span>官方網站首頁<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <div class=\"section-label\">我的清冊與統計<\/div>\n\n  <a class=\"btn\" href=\"registry.html\">\n    <span class=\"ico\" aria-hidden=\"true\">📋<\/span>\n    <span class=\"tx\"><b>我的名下寵物清冊<\/b><span>匯入官方 Excel・在此檢視<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <a class=\"btn\" href=\"stats.html\">\n    <span class=\"ico\" aria-hidden=\"true\">📊<\/span>\n    <span class=\"tx\"><b>全國登記統計<\/b><span>各縣市・年度趨勢・絕育率<\/span><\/span>\n    <span class=\"arrow\" aria-hidden=\"true\">›<\/span>\n  <\/a>\n\n  <div class=\"section-label\">查得到的資料<\/div>\n  <div class=\"info\">\n    <div class=\"row\"><span class=\"k\">飼主資訊<\/span><span>姓名・生日・戶籍/通訊地址<\/span><\/div>\n    <div class=\"row\"><span class=\"k\">寵物資訊<\/span><span>性別・品種・晶片號・狀態・絕育<\/span><\/div>\n    <div class=\"row\"><span class=\"k\">其他<\/span><span>狂犬病接種・登記單位・母犬貓・備註<\/span><\/div>\n    <div class=\"row\"><span class=\"k\">違規紀錄<\/span><span>是否違反動物保護法<\/span><\/div>\n    <hr />\n    <div class=\"row\"><span class=\"k\">服務時間<\/span><span>上班日 08:30–12:30、13:30–17:30<\/span><\/div>\n  <\/div>\n\n  <p class=\"note\">\n    本程式為非官方的「捷徑外殼」，查詢與資料皆由<br />\n    農業部官方系統 <a href=\"https://www.pet.gov.tw/\" target=\"_blank\" rel=\"noopener\">pet.gov.tw<\/a> 提供。<br />\n    需驗證碼／自然人憑證等身分驗證。\n  <\/p>\n<\/main>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<script>\n  // Service worker 註冊與「即時更新」提示已移至共用的 app.js\n\n  const toast = (msg) => {\n    const t = document.getElementById('toast');\n    t.textContent = msg; t.classList.add('show');\n    setTimeout(() => t.classList.remove('show'), 2600);\n  };\n\n  // Android / Chrome：自訂安裝按鈕\n  let deferred = null;\n  const bar = document.getElementById('install');\n  const btn = document.getElementById('installBtn');\n  window.addEventListener('beforeinstallprompt', (e) => {\n    e.preventDefault(); deferred = e; bar.style.display = 'flex';\n  });\n  btn.addEventListener('click', async () => {\n    if (!deferred) return;\n    deferred.prompt();\n    await deferred.userChoice;\n    deferred = null; bar.style.display = 'none';\n  });\n  window.addEventListener('appinstalled', () => {\n    bar.style.display = 'none'; toast('已加入主畫面 ✓');\n  });\n\n  // iOS：提示用「分享 → 加入主畫面」\n  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);\n  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;\n  if (isIOS && !standalone) {\n    bar.style.display = 'flex';\n    bar.querySelector('span').textContent = '📲 點下方「分享」→「加入主畫面」即可當 App';\n    btn.style.display = 'none';\n  }\n\n  // ===== 我的常用晶片號碼（只存本機 localStorage）=====\n  const OFFICIAL = 'https://www.pet.gov.tw/Web/O201_Fido.aspx?s=999';\n  const KEY = 'pet_chips_v1';\n  const $chip = document.getElementById('favChip');\n  const $name = document.getElementById('favName');\n  const $list = document.getElementById('favList');\n  const $empty = document.getElementById('favEmpty');\n\n  const load = () => {\n    try { return JSON.parse(localStorage.getItem(KEY)) || []; }\n    catch { return []; }\n  };\n  const save = (a) => localStorage.setItem(KEY, JSON.stringify(a));\n\n  const copyText = async (text) => {\n    try { await navigator.clipboard.writeText(text); return true; }\n    catch {\n      const t = document.createElement('textarea');\n      t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';\n      document.body.appendChild(t); t.select();\n      let ok = false; try { ok = document.execCommand('copy'); } catch {}\n      document.body.removeChild(t); return ok;\n    }\n  };\n\n  // 可記錄的查詢結果欄位\n  const GENDER = ['', '公', '母'];\n  const STATUS = ['', '登記', '轉讓', '變更', '除戶'];\n  const NEUTER = ['', '是', '否'];\n  const FIELDS = [\n    { k: 'breed', label: '品種', type: 'text', ph: '例：米克斯' },\n    { k: 'gender', label: '性別', type: 'select', opts: GENDER },\n    { k: 'status', label: '狀態', type: 'select', opts: STATUS },\n    { k: 'neuter', label: '已絕育', type: 'select', opts: NEUTER },\n    { k: 'rabies', label: '狂犬針日期', type: 'text', ph: 'YYYY/MM/DD' },\n    { k: 'note', label: '備註', type: 'text', full: true, ph: '其他備註' },\n  ];\n  const today = () => new Date().toISOString().slice(0, 10).replace(/-/g, '/');\n\n  const summary = (rec) => {\n    if (!rec) return '';\n    const p = [];\n    if (rec.breed) p.push(rec.breed);\n    if (rec.gender) p.push(rec.gender);\n    if (rec.status) p.push(rec.status);\n    if (rec.neuter) p.push('絕育' + rec.neuter);\n    return p.join('・');\n  };\n\n  const patch = (id, rec) => {\n    const items = load();\n    const it = items.find((x) => x.id === id);\n    if (!it) return;\n    it.rec = Object.assign({}, rec, { updated: today() });\n    save(items); render();\n  };\n\n  // 建立展開區（檢視 + 編輯查詢結果）\n  const buildDetail = (it) => {\n    const d = document.createElement('div');\n    d.className = 'detail'; d.hidden = true;\n\n    const renderView = () => {\n      d.innerHTML = '';\n      const rec = it.rec;\n      if (rec && summary(rec)) {\n        const view = document.createElement('div');\n        view.className = 'view';\n        FIELDS.forEach((f) => {\n          if (!rec[f.k]) return;\n          const row = document.createElement('div');\n          row.className = 'drow';\n          row.innerHTML = '<span class=\"dk\">' + f.label + '<\/span><span class=\"dv\"><\/span>';\n          row.querySelector('.dv').textContent = rec[f.k];\n          view.appendChild(row);\n        });\n        if (rec.updated) {\n          const u = document.createElement('div');\n          u.className = 'upd'; u.textContent = '紀錄更新：' + rec.updated;\n          view.appendChild(u);\n        }\n        d.appendChild(view);\n      } else {\n        const hint = document.createElement('div');\n        hint.style.cssText = 'font-size:.78rem;color:var(--muted);margin-bottom:2px';\n        hint.textContent = '查到結果後，記錄下來下次免再查。';\n        d.appendChild(hint);\n      }\n      const edit = document.createElement('button');\n      edit.className = 'editbtn';\n      edit.textContent = (rec && summary(rec)) ? '✎ 編輯紀錄' : '＋ 記錄查詢結果';\n      edit.onclick = renderEdit;\n      d.appendChild(edit);\n    };\n\n    const renderEdit = () => {\n      d.innerHTML = '';\n      const rec = it.rec || {};\n      const form = document.createElement('div');\n      form.className = 'edit';\n      const inputs = {};\n      FIELDS.forEach((f) => {\n        const lab = document.createElement('label');\n        if (f.full) lab.className = 'full';\n        lab.append(document.createTextNode(f.label));\n        let el;\n        if (f.type === 'select') {\n          el = document.createElement('select');\n          f.opts.forEach((o) => {\n            const op = document.createElement('option');\n            op.value = o; op.textContent = o || '—';\n            el.appendChild(op);\n          });\n        } else {\n          el = document.createElement('input');\n          el.type = 'text'; el.placeholder = f.ph || '';\n        }\n        el.value = rec[f.k] || '';\n        inputs[f.k] = el;\n        lab.appendChild(el);\n        form.appendChild(lab);\n      });\n      d.appendChild(form);\n\n      const btns = document.createElement('div');\n      btns.className = 'ebtns';\n      const save = document.createElement('button');\n      save.className = 'save'; save.textContent = '儲存';\n      save.onclick = () => {\n        const rec2 = {};\n        FIELDS.forEach((f) => { rec2[f.k] = (inputs[f.k].value || '').trim(); });\n        patch(it.id, rec2);\n        toast('已記錄 ✓');\n      };\n      const cancel = document.createElement('button');\n      cancel.className = 'cancel'; cancel.textContent = '取消';\n      cancel.onclick = renderView;\n      btns.append(save, cancel);\n      d.appendChild(btns);\n    };\n\n    renderView();\n    return d;\n  };\n\n  let filter = '';\n\n  const render = () => {\n    const items = load();\n    $list.innerHTML = '';\n    $empty.style.display = items.length ? 'none' : 'block';\n    document.getElementById('favSearchWrap').style.display = items.length > 1 ? 'block' : 'none';\n\n    const q = filter.trim().toLowerCase();\n    const digits = q.replace(/\\D/g, '');\n    const shown = q\n      ? items.filter((it) =>\n          (it.name || '').toLowerCase().includes(q) ||\n          (digits && it.chip.includes(digits)))\n      : items;\n\n    if (items.length && !shown.length) {\n      const nr = document.createElement('div');\n      nr.className = 'nores'; nr.textContent = '找不到符合「' + filter + '」的寵物';\n      $list.appendChild(nr);\n      return;\n    }\n\n    shown.forEach((it) => {\n      const li = document.createElement('li');\n      li.dataset.id = it.id;\n      const row1 = document.createElement('div');\n      row1.className = 'row1';\n\n      // 拖曳把手（搜尋中不顯示，避免排序混淆）；純指標操作，對輔助科技隱藏\n      if (!q) {\n        const handle = document.createElement('div');\n        handle.className = 'drag'; handle.title = '拖曳排序'; handle.textContent = '⠿';\n        handle.setAttribute('aria-hidden', 'true');\n        handle.addEventListener('pointerdown', (e) => startDrag(e, li));\n        row1.appendChild(handle);\n      }\n\n      const label = it.name || '未命名';\n      const meta = document.createElement('div');\n      meta.className = 'meta';\n      const b = document.createElement('b');\n      b.textContent = label;\n      const num = document.createElement('span');\n      num.className = 'num'; num.textContent = it.chip;\n      meta.append(b, num);\n      const s = summary(it.rec);\n      if (s) {\n        const sub = document.createElement('span');\n        sub.className = 'sub'; sub.textContent = '🐾 ' + s;\n        meta.appendChild(sub);\n      }\n\n      const copyBtn = document.createElement('button');\n      copyBtn.className = 'act'; copyBtn.type = 'button';\n      copyBtn.title = '複製'; copyBtn.textContent = '⧉';\n      copyBtn.setAttribute('aria-label', '複製「' + label + '」的晶片號碼');\n      copyBtn.onclick = async () => {\n        const ok = await copyText(it.chip);\n        toast(ok ? '已複製晶片號碼' : '複製失敗，請手動複製');\n      };\n\n      const qBtn = document.createElement('button');\n      qBtn.className = 'act q'; qBtn.type = 'button';\n      qBtn.title = '查詢'; qBtn.textContent = '🔍';\n      qBtn.setAttribute('aria-label', '複製並到官網查詢「' + label + '」');\n      qBtn.onclick = async () => {\n        const ok = await copyText(it.chip);\n        toast(ok ? '已複製晶片號碼 ⮕ 到官網「長按貼上」並填驗證碼' : '請手動複製晶片號碼');\n        window.open(OFFICIAL, '_blank', 'noopener');\n      };\n\n      const delBtn = document.createElement('button');\n      delBtn.className = 'act del'; delBtn.type = 'button';\n      delBtn.title = '刪除'; delBtn.textContent = '✕';\n      delBtn.setAttribute('aria-label', ' et i = hi + 1; i < aoa.length; i++) {\n      const r = aoa[i]; if (!r || !String(r[0] == null ? '' : r[0]).trim()) continue;\n      const d = {};\n      header.forEach((h, j) => {\n        const key = HMAP[h] || h;\n        d[key] = String(r[j] == null ? '' : r[j]).trim();\n      });\n      rows.push(d);\n    }\n    return rows;\n  }\n\n  document.getElementById('file').addEventListener('change', async (e) => {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    setStatus('讀取中…');\n    try {\n      const isJson = /\\.json$/i.test(file.name) || file.type === 'application/json';\n      let rows, owner;\n      if (isJson) {\n        // 還原 JSON 備份\n        const data = JSON.parse(await file.text());\n        rows = Array.isArray(data) ? data : data.rows;\n        if (!Array.isArray(rows) || !rows.length) throw new Error('備份檔格式不正確');\n        owner = (data && data.owner) || (rows[0] && rows[0].owner) || '';\n      } else {\n        // 解析官方 Excel / CSV\n        await loadXLSX();\n        const buf = await file.arrayBuffer();\n        const wb = XLSX.read(buf, { type: 'array' });\n        const ws = wb.Sheets[wb.SheetNames[0]];\n        const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });\n        rows = parseAoA(aoa);\n        if (!rows.length) throw new Error('檔案中沒有寵物資料');\n        owner = rows[0].owner || '';\n      }\n      save({ importedAt: new Date().toISOString().slice(0,10).replace(/-/g,'/'),\n             fileName: file.name, owner, rows });\n      setStatus('✓ 已匯入 ' + rows.length + ' 筆');\n      setTimeout(() => setStatus(''), 2000);\n      render();\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    } catch (err) {\n      setStatus('❌ ' + (err.message || '匯入失敗') +\n        (/load failed/.test(err.message||'') ? '（匯入 Excel 需連線載入解析元件）' : ''));\n    }\n    e.target.value = '';\n  });\n\n  document.getElementById('exportBtn').addEventListener('click', () => {\n    const data = load();\n    if (!data || !data.rows || !data.rows.length) { setStatus('沒有可匯出的資料'); return; }\n    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = '名下寵物清冊備份_' + data.importedAt.replace(/\\//g, '') + '.json';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n    setStatus('已匯出備份（' + data.rows.length + ' 筆）'); setTimeout(() => setStatus(''), 2200);\n  });\n\n  document.getElementById('clearBtn').addEventListener('click', () => {\n    if (!confirm('確定清除本機的清冊資料？（可再重新匯入）')) return;\n    localStorage.removeItem(KEY); filter = '';\n    document.getElementById('q').value = '';\n    render(); setStatus('已清除'); setTimeout(() => setStatus(''), 1500);\n  });\n\n  document.getElementById('q').addEventListener('input', (e) => { filter = e.target.value; render(); });\n\n  function tagClass(field, val) {\n    if (field === 'neuter') return val === '絕育' ? 'g' : (val === '未絕育' ? 'a' : '');\n    if (field === 'removed') return val === '是' ? 'r' : '';\n    return '';\n  }\n\n  function render() {\n    const data = load();\n    const content = document.getElementById('content');\n    if (!data || !data.rows || !data.rows.length) {\n      content.style.display = 'none';\n      document.getElementById('note').textContent = '';\n      return;\n    }\n    content.style.display = 'block';\n    document.getElementById('sub').textContent =\n      (data.owner ? data.owner + '・' : '') + '共 ' + data.rows.length + ' 筆・匯入 ' + data.importedAt;\n\n    // 摘要\n    const cats = data.rows.filter((r) => r.type === '貓').length;\n    const dogs = data.rows.filter((r) => r.type === '犬' || r.type === '狗').length;\n    const neu = data.rows.filter((r) => r.neuter === '絕育').length;\n    document.getElementById('sum').innerHTML =\n      '<div class=\"stat\"><div class=\"big\">' + data.rows.length + '<\/div>< >\n\n  <div class=\"section-label\">年度趨勢<\/div>\n  <div class=\"trend\" id=\"trend\"><\/div>\n\n  <p class=\"note\" id=\"note\"><\/p>\n<\/main>\n\n<script>\n  const fmt = (n) => (n == null ? '—' : n.toLocaleString('en-US'));\n  const state = { data: null, animal: 'dog' };\n\n  Promise.resolve({ json: function(){ return Promise.resolve(window.__STATS_DATA__); } })\n    .then((r) => r.json())\n    .then((d) => { state.data = d; init(d); })\n    .catch(() => { document.getElementById('err').style.display = 'block';\n                   document.getElementById('srcline').textContent = '資料載入失敗'; });\n\n  function init(d) {\n    const ly = String(d.latestYear);\n    const py = String(d.latestYear - 1);\n    document.getElementById('yLabel').textContent = ly + ' 年';\n    document.getElementById('srcline').textContent = '資料截至 ' + d.fetchedAt + '・年度 ' + ly;\n    document.getElementById('note').innerHTML =\n      d.note + '<br>資料來源：<a href=\"' + d.sourceUrl + '\" target=\"_blank\" rel=\"noopener\">' +\n      d.source + '<\/a>';\n\n    renderSum(d, ly, py);\n    renderTrend(d);\n    renderBars();\n\n    document.getElementById('toggle').addEventListener('click', (e) => {\n      const b = e.target.closest('button'); if (!b) return;\n      state.animal = b.dataset.a;\n      [...document.querySelectorAll('#toggle button')].forEach((x) => {\n        const on = x.dataset.a === state.animal;\n        x.classList.toggle('on', on);\n        x.setAttribute('aria-pressed', String(on));\n      });\n      renderBars();\n    });\n  }\n\n  function delta(now, prev) {\n    if (prev == null || !prev) return '';\n    const diff = now - prev;\n    const pct = Math.abs(diff / prev * 100).toFixed(1);\n    const cls = diff >= 0 ? 'up' : 'down';\n    const arrow = diff >= 0 ? '▲' : '▼';\n    return '<span class=\"' + cls + '\">' + arrow + ' ' + pct + '% vs 前一年<\/span>';\n  }\n\n  function renderSum(d, ly, py) {\n    const cfg = [\n      { a: 'dog', label: '犬', emoji: '🐶', color: 'var(--dog)' },\n      { a: 'cat', label: '貓', emoji: '🐱', color: 'var(--cat)' },\n    ];\n    document.getElementById('sum').innerHTML = cfg.map((c) => {\n      const now = d.years[ly].national[c.a];\n      const prev = d.years[py] ? d.years[py].national[c.a] : null;\n      return '<div class=\"stat\">' +\n        '<div class=\"h\"><span class=\"dot\" style=\"background:' + c.color + '\"><\/span>' +\n        c.emoji + ' ' + c.label + '隻登記<\/div>' +\n        '<div class=\"big\">' + fmt(now.reg) + '<\/div>' +\n        '<div class=\"sub\">絕育率 ' + now.rate + '%<\/div>' +\n        '<div class=\"sub\">' + delta(now.reg, prev ? prev.reg : null) + '<\/div>' +\n        '<\/div>';\n    }).join('');\n  }\n\n  function renderBars() {\n    const d = state.data, a = state.animal;\n    const ly = String(d.latestYear);\n    const list = d.years[ly].byCounty[a];\n    const max = Math.max(...list.map((x) => x.reg)) || 1;\n    const color = a === 'dog' ? 'var(--dog)' : 'var(--cat)';\n    document.getElementById('bars').innerHTML = list.map((c) =>\n      '<div class=\"bar\">' +\n        '<div class=\"top\"><span class=\"nm\">' + c.name + '<\/span>' +\n        '<span class=\"vl\">' + fmt(c.reg) + '<\/span><\/div>' +\n        '<div class=\"track\"><div class=\"fill\" style=\"width:' +\n          (c.reg / max * 100) + '%;background:' + color + '\"><\/div><\/div>' +\n        '<div class=\"rate\">絕育率 ' + c.rate + '%<\/div>' +\n      '<\/div>'\n    ).join('');\n  }\n\n  function renderTrend(d) {\n    const years = Object.keys(d.years).sort();\n    const cfg = [\n      { a: 'dog', label: '🐶 犬隻登記', color: 'var(--dog)' },\n      { a: 'cat', label: '🐱 貓隻登記', color: 'var(--cat)' },\n    ];\n    const maxAll = Math.max(...cfg.flatMap((c) =>\n      years.map((y) => d.years[y].national[c.a].reg))) || 1;\n    document.getElementById('trend').innerHTML = cfg.map((c) =>\n      '<div class=\"col\"><h3>' + c.label + '<\/h3>' +\n      years.map((y) => {\n        const v = d.years[y].national[c.a].reg;\n        return '<div class=\"yr\"><span class=\"y\">' + y + '<\/span>' +\n          '<span class=\"t\"><i style=\"width:' + (v / maxAll * 100) + '%;background:' + c.color + '\"><\/i><\/span>' +\n          '<span class=\"n\">' + fmt(v) + '<\/span><\/div>';\n      }).join('') +\n      '<\/div>'\n    ).join('');\n  }\n<\/script>\n<script>\n(function(){\n  var root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;\n  var KEY='pet_theme', ORDER=['auto','light','dark'];\n  var INFO={auto:{i:'🌗',n:'跟隨系統'},light:{i:'☀️',n:'淺色'},dark:{i:'🌙',n:'深色'}};\n  var COLOR={light:'#0f766e',dark:'#0f5b54'};\n  function pref(){try{var v=localStorage.getItem(KEY);return (v==='light'||v==='dark')?v:(window.__theme||'auto');}catch(e){return window.__theme||'auto';}}\n  function sysDark(){return mq?mq.matches:false;}\n  function res(p){return (p==='dark'||(p==='auto'&&sysDark()))?'dark':'light';}\n  function apply(p){var t=res(p);root.setAttribute('data-theme',t);var m=document.querySelector('meta[name=\"theme-color\"]');if(m)m.setAttribute('content',COLOR[t]);\n    var bs=document.querySelectorAll('[data-theme-toggle]');for(var i=0;i<bs.length;i++){var b=bs[i],ic=b.querySelector('.tt-ico');if(ic)ic.textContent=INFO[p].i;b.setAttribute('aria-label','佈景主題：'+INFO[p].n+'，點擊切換');b.setAttribute('title','佈景主題：'+INFO[p].n);}}\n  function setp(p){window.__theme=p;try{if(p==='auto')localStorage.removeItem(KEY);else localStorage.setItem(KEY,p);}catch(e){}apply(p);}\n  document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('[data-theme-toggle]'):null;if(!b)return;setp(ORDER[(ORDER.indexOf(pref())+1)%ORDER.length]);});\n  if(mq){var f=function(){if(pref()==='auto')apply('auto');};mq.addEventListener?mq.addEventListener('change',f):(mq.addListener&&mq.addListener(f));}\n  apply(pref());\n})();<\/script>\n<\/body>\n<\/html>\n" };
